services:
  postgres:
    image: postgres:16-alpine
    container_name: stockbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockbridge
      POSTGRES_USER: stockbridge
      POSTGRES_PASSWORD: stockbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbridge -d stockbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
