server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: StockBridgeBack-Test
  datasource:
    url: jdbc:h2:mem:stockbridge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  data:
    mongodb:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

backend:
  api-key: test-stockbridge-api-key-2026

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
