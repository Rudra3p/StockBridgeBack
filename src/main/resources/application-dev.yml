spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockbridge}
    username: ${SPRING_DATASOURCE_USERNAME:stockbridge}
    password: ${SPRING_DATASOURCE_PASSWORD:stockbridge}
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/stockbridge}
      database: ${MONGODB_DATABASE:stockbridge}

backend:
  api-key: ${BACKEND_API_KEY:sb_sec_b3d3c16a8eb1e9d9f8a619ef494e7743f0af90247797f782}

jwt:
  secret: ${JWT_SECRET:dev_dummy_secret_key_for_local_testing_only_must_be_overridden_in_prod_32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
