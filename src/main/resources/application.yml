server:
  port: ${PORT:8080}

spring:
  application:
    name: StockBridgeBack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/stockbridge}
      database: ${MONGODB_DATABASE:stockbridge}

# Only expose the health endpoint for Render health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

backend:
  api-key: ${BACKEND_API_KEY:}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
